<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmzSearch - Google Style</title>
    <style src="style.css"></style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button
        class="apps-button"
        onclick="toggleFilters()"
        title="検索フィルタ"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"
          ></path>
        </svg>
      </button>

      <div id="filterPanel" class="filter-panel">
        <div class="filter-section">
          <h4>並び替え</h4>
          <select id="sortOrder">
            <option value="">標準</option>
            <option value="price-asc-rank">価格の安い順</option>
            <option value="price-desc-rank">価格の高い順</option>
            <option value="review-rank">レビュー評価順</option>
            <option value="date-desc-rank">最新商品順</option>
          </select>
        </div>
        <div class="filter-section">
          <h4>カテゴリー</h4>
          <select id="category">
            <option value="aps">すべて</option>
            <option value="electronics">家電・カメラ</option>
            <option value="videogames">テレビゲーム</option>
            <option value="books-jp">本 (和書)</option>
            <option value="fashion">ファッション</option>
          </select>
        </div>
        <div class="filter-section">
          <label>
            <input type="checkbox" id="primeOnly" /> Amazon Primeのみ
          </label>
        </div>
      </div>
    </header>

    <div class="logo">
      <span>A</span><span>m</span><span>a</span><span>z</span><span>o</span
      ><span>n</span>
    </div>

    <div class="search-container">
      <form id="searchForm">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            autocomplete="off"
            placeholder="Amazonで検索"
          />
        </div>
        <div class="button-container">
          <button type="submit" class="main-btn">Amazon 検索</button>
          <button type="button" class="main-btn" onclick="luckySearch()">
            I'm Feeling Lucky
          </button>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
